[project]
name = "robojepa-worlds"
version = "0.1.0"
description = "Single-GPU RoboJEPA adaptation to interactive environments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "numpy==2.2.5",
  "einops==0.8.1", "scipy==1.15.3", "pillow==11.2.1",
  "av==14.4.0", "PyYAML==6.0.2", "wandb==0.25.0",
  "timm==1.0.15", "requests==2.32.3", "safetensors==0.5.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
